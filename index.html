<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ευζωία Οδηγοί</title>
<meta name="theme-color" content="#5c1612">
<style>
:root{--bg:#f7f6f1;--fg:#22231d;--muted:#5d6152;--brand:#5c1612;--line:#d9dbcc;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171812;--fg:#ecebe3;--muted:#b0b3a2;--brand:#e59a92;--line:#3a3c2f;--surface:#212219;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:2.5rem max(16px,env(safe-area-inset-left,0px))}
h1{color:var(--brand);margin:0 0 .5rem}
p{color:var(--muted);margin:0 0 1.5rem}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;color:var(--fg);text-decoration:none;margin-bottom:.75rem}
a.card strong{display:block;font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>Ευζωία</h1>
<p>Διαδραστικοί οδηγοί για την αλλαγή τρόπου ζωής. Κλινική μελέτη, Πανεπιστήμιο Κρήτης.</p>
<a class="card" href="diatrofi/"><strong>Διατροφή</strong>Το πιάτο της υγείας, τι και πόσο συχνά, αλάτι, κουίζ και η αλλαγή της εβδομάδας.</a>
</main>
</body>
</html>
